name: Secret scan

# Runs on every pull request, whatever its base branch (a stacked pull request is covered too),
# and on pushes to main. It scans only the commits the change introduces.
on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.28.0"
  # sha256 of gitleaks_8.28.0_linux_x64.tar.gz, from the release's checksums file.
  GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the commits this change introduces
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [ -n "$BEFORE_SHA" ] && ! echo "$BEFORE_SHA" | grep -qE '^0+$'; then
            range="${BEFORE_SHA}..${AFTER_SHA}"
          else
            range="${AFTER_SHA}~1..${AFTER_SHA}"
          fi
          scripts/scan-secrets.sh "$range"
