# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive 
        
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.0'

    - name: Install native ZeroMQ development headers
      run: sudo apt-get update && sudo apt-get install -y libzmq3-dev pkg-config

    - name: Test
      working-directory: ./dokja_orch
      run: go test -v ./...

    - name: Test the feeds service
      working-directory: ./dokja_services/dokja_feeds
      run: go test -v ./...

    - name: Test the digest domain
      working-directory: ./dokja_domain/dokja_digest
      run: go test -v ./...

    - name: Test local runtime domain
      working-directory: ./dokja_domain/dokja_runtime
      run: go test -race ./...

    - name: Test local runtime adapter
      working-directory: ./dokja_services/dokja_runtime
      run: go test -race ./...

    - name: Test bootstrap runtime orchestrator
      working-directory: ./dokja_orch/runtime
      run: go test -race ./...
