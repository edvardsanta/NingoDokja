name: Knowledge PostgreSQL

on:
  pull_request:
    paths:
      - 'dokja_services/dokja_knowledge/**'
      - 'docker-compose*.yml'
      - '.github/workflows/knowledge-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'dokja_services/dokja_knowledge/**'
      - '.github/workflows/knowledge-postgres.yml'

permissions:
  contents: read

jobs:
  knowledge:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: knowledge_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d knowledge_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: >-
          python -m pip install numpy pyzmq pypdf requests pytest
          -r dokja_services/dokja_knowledge/postgres-requirements.txt
      - run: python -m pytest -q dokja_services/dokja_knowledge/tests
        env:
          KNOWLEDGE_TEST_POSTGRES_DSN: postgresql://postgres@localhost:5432/knowledge_test
