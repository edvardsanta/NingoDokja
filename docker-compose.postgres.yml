# Apply with a base stack. Storage selection stays explicit in the owner's env.
services:
  dokja-postgres:
    image: docker.io/pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: dokja
      POSTGRES_USER: dokja
      POSTGRES_PASSWORD: ${DOKJA_POSTGRES_PASSWORD:?set DOKJA_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dokja -d dokja"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - dokja-postgres-data:/var/lib/postgresql/data
    networks:
      - dokja-net

volumes:
  dokja-postgres-data:
