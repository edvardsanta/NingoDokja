services:
  dokja-orchestrator:
    build:
      context: .
      dockerfile: dokja_orch/Dockerfile.dev
    command: /go/bin/air -c .air.toml
    security_opt:
      - apparmor:unconfined
    cap_add:
      - SYS_PTRACE
    environment:
      VA_ZMQ_ENDPOINT: tcp://*:5555
      VA_ZMQ_REQUEST_ENDPOINT: tcp://*:5558
      VA_HTTP_ENDPOINT: :8091
      VA_RESPONSE_MODE: debug
      MEME_SERVICE_ENDPOINT: ${MEME_SERVICE_ENDPOINT:-tcp://dokja-meme:5557}
      BOOK_SERVICE_ENDPOINT: http://dokja-book:8083
      CHAT_AI_SERVICE_ENDPOINT: http://dokja-chat-ai:8080
      KNOWLEDGE_SERVICE_ENDPOINT: tcp://dokja-knowledge:5561
      DISCORD_INTERFACE_ENDPOINT: http://dokja-discord:8092/deliver
      DISCORD_SCHEDULED_MEME_CHANNEL_ID: ${DISCORD_SCHEDULED_MEME_CHANNEL_ID}
      DISCORD_SAFE_ONLY_CHANNEL_IDS: ${DISCORD_SAFE_ONLY_CHANNEL_IDS:-}
      # Operator switches (services on/off, job pause, intervals); shared with the scheduler.
      VA_STATE_FILE: /workspace/.dokja/state.json
      # Shared SQLite: chat provider profiles (the token never crosses the orchestrator).
      DOKJA_DB_FILE: /workspace/.dokja/dokja.db
      GOCACHE: /tmp/go-build
    volumes:
      - ./:/workspace
    ports:
      - "5555:5555"
      - "5558:5558"
      - "8091:8091"
      - "40000:40000"
    depends_on:
      - dokja-chat-ai
      - dokja-book
    networks:
      - dokja-net

  dokja-book:
    build:
      context: .
      dockerfile: dokja_services/dokja_book/Dockerfile.dev
    working_dir: /workspace
    command: python dokja_services/dokja_book/main.py
    environment:
      DOKJA_BOOK_HOST: 0.0.0.0
      DOKJA_BOOK_PORT: 8083
      DOKJA_BOOK_DEFAULT_LANGUAGE: ${DOKJA_BOOK_DEFAULT_LANGUAGE:-pt-BR}
      DOKJA_BOOK_DEFAULT_GOAL: ${DOKJA_BOOK_DEFAULT_GOAL:-study}
      DOKJA_BOOK_CLASSIFIER_PROVIDER: ${DOKJA_BOOK_CLASSIFIER_PROVIDER:-local}
      DOKJA_BOOK_CLASSIFIER_MODEL: ${DOKJA_BOOK_CLASSIFIER_MODEL:-typeform/distilbert-base-uncased-mnli}
      DOKJA_BOOK_CLASSIFIER_ENDPOINT: ${DOKJA_BOOK_CLASSIFIER_ENDPOINT:-}
      DOKJA_BOOK_OVERVIEW_PROVIDER: ${DOKJA_BOOK_OVERVIEW_PROVIDER:-transformers}
      DOKJA_BOOK_OVERVIEW_MODEL: ${DOKJA_BOOK_OVERVIEW_MODEL:-sshleifer/distilbart-cnn-12-6}
      DOKJA_BOOK_OVERVIEW_ENDPOINT: ${DOKJA_BOOK_OVERVIEW_ENDPOINT:-}
      DOKJA_BOOK_MODEL_CACHE_DIR: /workspace/dokja_services/dokja_book/models
    volumes:
      - ./:/workspace
    ports:
      - "8083:8083"
    networks:
      - dokja-net

  dokja-meme:
    build:
      context: .
      dockerfile: dokja_services/dokja_meme/Dockerfile.dev
    working_dir: /workspace
    command: python dokja_services/dokja_meme/main.py
    environment:
      MEME_SERVICE_ENDPOINT: tcp://*:5557
      MEME_SERVICE_DB_FILE: /workspace/ningo_memory.db
      MEME_SERVICE_SCRAPERS: memedroid
      DOKJA_NSFW_MODEL_PATH: /models/nudenet/320n.onnx
      DOKJA_OCR_MODEL_DIR: /models/rapidocr
      MEME_NSFW_EXTRA_WORDS: ${MEME_NSFW_EXTRA_WORDS:-}
    ports:
      - "5557:5557"
    networks:
      - dokja-net
    volumes:
      - ./:/workspace
      - ${DOKJA_MODELS_DIR:-./.dokja/models}:/models:ro

  dokja-knowledge:
    build:
      context: .
      dockerfile: dokja_services/dokja_knowledge/Dockerfile.dev
    working_dir: /workspace/dokja_services/dokja_knowledge
    command: python main.py
    environment:
      KNOWLEDGE_SERVICE_ENDPOINT: tcp://*:5561
      KNOWLEDGE_DB_FILE: /workspace/.dokja/dokja_knowledge.db
      DOKJA_EMBED_ENDPOINT: http://dokja-ollama:11434
      DOKJA_EMBED_MODEL: ${DOKJA_EMBED_MODEL:-bge-m3}
      KNOWLEDGE_MIN_SCORE: ${KNOWLEDGE_MIN_SCORE:-0.45}
      KNOWLEDGE_FETCH: ${KNOWLEDGE_FETCH:-on}
    ports:
      - "127.0.0.1:5561:5561"
    depends_on:
      - dokja-ollama
    networks:
      - dokja-net
    volumes:
      - ./:/workspace

  dokja-ollama:
    image: docker.io/ollama/ollama:latest
    volumes:
      # Reuses the models already pulled on this machine (bge-m3 is ~1.2 GB).
      - ${OLLAMA_MODELS_DIR:-${HOME}/.ollama}:/root/.ollama
    networks:
      - dokja-net

  dokja-chat-ai:
    build:
      context: .
      dockerfile: dokja_services/dokja_chat_ai/Dockerfile.dev
    working_dir: /workspace
    command: python dokja_services/dokja_chat_ai/main.py
    environment:
      CHAT_AI_SERVICE_HOST: 0.0.0.0
      CHAT_AI_SERVICE_PORT: 8080
      CHAT_AI_API_KEY: ${CHAT_AI_API_KEY}
      CHAT_AI_BASE_URL: ${CHAT_AI_BASE_URL}
      CHAT_AI_MODEL: ${CHAT_AI_MODEL}
      DOKJA_DB_FILE: /workspace/.dokja/dokja.db
    volumes:
      - ./:/workspace
    ports:
      - "8080:8080"
    networks:
      - dokja-net

  dokja-voice:
    build:
      context: .
      dockerfile: dokja_services/dokja_voice/Dockerfile.dev
    working_dir: /workspace
    command: python dokja_services/dokja_voice/main.py
    environment:
      DOKJA_VOICE_HOST: 0.0.0.0
      DOKJA_VOICE_PORT: 8081
      DOKJA_VOICE_PROVIDER: ${DOKJA_VOICE_PROVIDER:-stub}
      DOKJA_VOICE_STT_PROVIDER: ${DOKJA_VOICE_STT_PROVIDER:-stub}
      DOKJA_VOICE_DEFAULT_VOICE: ${DOKJA_VOICE_DEFAULT_VOICE:-default}
      DOKJA_VOICE_DEFAULT_LANGUAGE: ${DOKJA_VOICE_DEFAULT_LANGUAGE:-pt-BR}
      DOKJA_VOICE_PIPER_MODEL: ${DOKJA_VOICE_PIPER_MODEL:-}
      DOKJA_VOICE_STT_MODEL: ${DOKJA_VOICE_STT_MODEL:-openai/whisper-tiny}
      DOKJA_VOICE_MODEL_CACHE_DIR: ${DOKJA_VOICE_MODEL_CACHE_DIR:-/workspace/dokja_services/dokja_voice/models}
      DOKJA_VOICE_WAKEWORD_PROVIDER: ${DOKJA_VOICE_WAKEWORD_PROVIDER:-stub}
      DOKJA_VOICE_WAKEWORD_MODEL: ${DOKJA_VOICE_WAKEWORD_MODEL:-}
      DOKJA_VOICE_WAKEWORD_HOTWORD: ${DOKJA_VOICE_WAKEWORD_HOTWORD:-Ningo}
      DOKJA_VOICE_WAKEWORD_THRESHOLD: ${DOKJA_VOICE_WAKEWORD_THRESHOLD:-0.5}
    volumes:
      - ./:/workspace
    ports:
      - "8081:8081"
    networks:
      - dokja-net

  dokja-cli:
    build:
      context: .
      dockerfile: dokja_interfaces/cli/Dockerfile.dev
    entrypoint: ["/usr/local/go/bin/go", "run", "./cmd/dokja-cli"]
    environment:
      DOKJA_ORCH_ENDPOINT: tcp://dokja-orchestrator:5555
      DOKJA_ORCH_REQUEST_ENDPOINT: tcp://dokja-orchestrator:5558
      GOCACHE: /tmp/go-build
      DOKJA_DB_FILE: /workspace/.dokja/dokja.db
    volumes:
      - ./:/workspace
    networks:
      - dokja-net


  dokja-tui:
    build:
      context: .
      dockerfile: dokja_interfaces/cli/Dockerfile.dev
    working_dir: /workspace/dokja_interfaces/tui
    entrypoint: ["/usr/local/go/bin/go", "run", "./cmd/dokja-tui"]
    environment:
      DOKJA_ORCH_REQUEST_ENDPOINT: tcp://dokja-orchestrator:5558
      # The container gets a plain TERM; these let the TUI recognise a kitty-protocol terminal.
      TERM: xterm-256color
      COLORTERM: ${COLORTERM:-truecolor}
      KITTY_WINDOW_ID: ${KITTY_WINDOW_ID:-}
      TERM_PROGRAM: ${TERM_PROGRAM:-}
      GOCACHE: /tmp/go-build
      DOKJA_DB_FILE: /workspace/.dokja/dokja.db
    volumes:
      - ./:/workspace
    stdin_open: true
    tty: true
    networks:
      - dokja-net

  dokja-discord:
    build:
      context: .
      dockerfile: dokja_interfaces/discord/Dockerfile.dev
    working_dir: /workspace/dokja_interfaces/discord
    command: sh -lc "pnpm install --no-frozen-lockfile && pnpm dev:watch"
    environment:
      CI: "true"
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DOKJA_ORCH_HTTP_ENDPOINT: http://dokja-orchestrator:8091/orchestrator
      DOKJA_VOICE_HTTP_ENDPOINT: http://dokja-voice:8081
      DOKJA_DISCORD_DELIVERY_PORT: 8092
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_ALLOWED_CHANNELS: ${DISCORD_ALLOWED_CHANNELS:-}
      DOKJA_DISCORD_WEBHOOKS: ${DOKJA_DISCORD_WEBHOOKS:-}
      DISCORD_DM_POLICY: ${DISCORD_DM_POLICY:-open}
    volumes:
      - ./:/workspace
    depends_on:
      - dokja-orchestrator
      - dokja-voice
    networks:
      - dokja-net

  dokja-scheduler:
    build:
      context: .
      dockerfile: dokja_services/dokja_scheduler/Dockerfile.dev
    working_dir: /workspace/dokja_services/dokja_scheduler
    command: ["/usr/local/go/bin/go", "run", "./cmd/dokja-scheduler"]
    environment:
      DOKJA_SCHEDULER_EVENT_ENDPOINT: tcp://dokja-orchestrator:5555
      DOKJA_SCHEDULER_TOPIC: events
      DOKJA_SCHEDULER_MEME_REFRESH_INTERVAL: ${DOKJA_SCHEDULER_MEME_REFRESH_INTERVAL:-45m}
      DOKJA_SCHEDULER_MEME_DISPATCH_INTERVAL: ${DOKJA_SCHEDULER_MEME_DISPATCH_INTERVAL:-6h}
      DOKJA_SCHEDULER_MEME_BOOTSTRAP_GRACE_PERIOD: ${DOKJA_SCHEDULER_MEME_BOOTSTRAP_GRACE_PERIOD:-15s}
      DOKJA_SCHEDULER_MEME_REFRESH_MAX_ITEMS: ${DOKJA_SCHEDULER_MEME_REFRESH_MAX_ITEMS:-20}
      DOKJA_SCHEDULER_MEME_DISPATCH_LIMIT: ${DOKJA_SCHEDULER_MEME_DISPATCH_LIMIT:-1}
      DOKJA_SCHEDULER_BR_MATCH_CHECK_INTERVAL: ${DOKJA_SCHEDULER_BR_MATCH_CHECK_INTERVAL:-30m}
      DOKJA_STATE_FILE: /workspace/.dokja/state.json
      GOCACHE: /tmp/go-build
    volumes:
      - ./:/workspace
    depends_on:
      - dokja-orchestrator
    networks:
      - dokja-net

networks:
  dokja-net:
    driver: bridge
