root = "."
tmp_dir = "/tmp/air"

[build]
cmd = "go build -o /tmp/air/dokja-va ./cmd/va"
bin = "/tmp/air/dokja-va"
include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "json"]
exclude_dir = ["vendor", "tmp", ".git"]
delay = 500
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
