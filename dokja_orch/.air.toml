root = "."
tmp_dir = "/tmp/air"

[build]
# TODO: Resolve hot reload issue with dlv. Currently, we have to restart the server manually after code changes.
cmd = "dlv debug ./cmd/va --headless --listen=:40000 --api-version=2 --accept-multiclient"
bin = "/tmp/air/dokja-va"
include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "json"]
exclude_dir = ["vendor", "tmp", ".git"]
delay = 500
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
