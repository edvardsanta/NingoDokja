<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Meu App Flask{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='custom.css') }}">
    <style>
        #sidebar {
            transition: transform 0.3s ease;
        }
        #sidebar.collapsed {
            transform: translateX(-250px);
        }
    </style>
</head>
<body>
<div class="d-flex">

    <!-- Sidebar -->
    <div id="sidebar" class="bg-dark text-white p-3 vh-100" style="width: 250px;">
        <h4 class="mb-4">Ningo Dokja</h4>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link text-white" href="workers">🏠 Início</a>
            </li>
              <li class="nav-item">
                <a class="nav-link text-white" href="/workers/config">🏠 Config</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="/memes">ℹ️ Memes</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="/chat/message">ℹ️ Chat</a>
            </li>
        </ul>
    </div>

    <!-- Conteúdo principal -->
    <div class="flex-grow-1 p-4 container-fluid">
        <button class="btn btn-outline-secondary mb-3" id="toggleSidebar">☰ Menu</button>
        {% block content %}{% endblock %}
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const toggleBtn = document.getElementById("toggleSidebar");
    const sidebar = document.getElementById("sidebar");

    toggleBtn.addEventListener("click", () => {
        sidebar.classList.toggle("collapsed");
    });
</script>
</body>
</html>
