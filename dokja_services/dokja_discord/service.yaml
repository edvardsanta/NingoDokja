name: dokja-discord
description: Discord communication adapter for inbound events and requested delivery

type: service
language: typescript
entrypoint: ./main.ts

exposes:
  - events

consumes:
  - events

depends_on:
  - dokja-orchestrator

tags:
  - domain:discord
  - criticality:high

paths:
  source: ./
  tests: ./
  docs: ../../dokja_docs/discord-interface.md

runtime:
  containerized: true
  dockerfile: ./Dockerfile.dev
