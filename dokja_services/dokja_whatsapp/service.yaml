name: dokja-whatsapp
description: WhatsApp communication adapter for linked sessions, inbound events and requested text delivery

type: service
language: typescript
entrypoint: ./main.ts

exposes:
  - events

consumes:
  - events

depends_on:
  - dokja-orchestrator

tags:
  - domain:whatsapp
  - criticality:low

paths:
  source: ./
  tests: ./tests
  docs: ../../dokja_docs/whatsapp-interface.md

runtime:
  containerized: true
  dockerfile: ./Dockerfile.dev
