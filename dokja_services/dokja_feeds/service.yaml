name: dokja-feeds
description: Hosts versioned collection, document processing and media plugins for content workflows

type: service
language: go
entrypoint: ./cmd/dokja-feeds/main.go

exposes:
  - requests

tags:
  - domain:digest
  - criticality:low

paths:
  source: ./
  tests: ./
  docs: ./

runtime:
  containerized: true
  dockerfile: ./Dockerfile.dev
